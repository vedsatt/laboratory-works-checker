events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        
        location / {
            try_files $uri $uri.html $uri/ /index.html;
        }

        location /labs/ {
            alias /labs/;
            try_files $uri $uri/ =404;
        }

        location /api {
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
        }
    }
}